<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Hisab Kitab - Family Budget Planner</title>
<style>
:root{--primary:#0f766e;--primary-d:#115e59;--bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--danger:#dc2626;--warn:#d97706;--ok:#16a34a;--radius:12px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
header{background:var(--primary);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-weight:700;font-size:18px}
.logo small{display:block;font-weight:400;font-size:12px;opacity:.85}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;color:#d1fae5;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
nav button.active,nav button:hover{background:var(--primary-d);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.two{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media (max-width:700px){.two{grid-template-columns:1fr}.hide-sm{display:none}}
.stat .label{color:var(--muted);font-size:13px}
.stat .value{font-size:22px;font-weight:700;margin-top:4px}
h2{margin:0 0 12px;font-size:19px}
h3{margin:0 0 8px;font-size:16px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:#fff}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.btn{background:var(--primary);color:#fff;border:0;padding:9px 14px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--primary-d)}
.btn.secondary{background:#e5e7eb;color:var(--text)}
.btn.secondary:hover{background:#d1d5db}
.btn.danger{background:var(--danger)}
.btn.small{padding:5px 9px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:13px}
td.num,th.num{text-align:right;white-space:nowrap}
.bar{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden}
.bar>div{height:100%;background:var(--primary)}
.bar.warn>div{background:var(--warn)}
.bar.over>div{background:var(--danger)}
.chart{display:flex;align-items:flex-end;gap:3px;height:160px;padding-top:8px}
.chart div.col{flex:1;background:var(--primary);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.chart div.col:hover::after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:11px;padding:3px 6px;border-radius:4px;white-space:nowrap;z-index:2}
.banner{background:#fef3c7;border:1px solid #f59e0b;border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;z-index:50;display:none}
.muted{color:var(--muted)}
.tag{display:inline-block;background:#ecfdf5;color:var(--primary-d);padding:2px 8px;border-radius:999px;font-size:12px}
.up{color:var(--danger)}
.down{color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:24px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tip{border-left:4px solid var(--primary);padding:10px 12px;background:#f9fafb;border-radius:8px;margin-bottom:10px}
.tbl-wrap{overflow:auto}
@media print{header,nav,.no-print,#banner,.toast{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>
<header>
  <div class="logo">Daily Hisab Kitab<small id="householdName">Family Budget Planner</small></div>
  <nav id="nav"></nav>
  <div class="row"><input type="month" id="monthPick" style="width:auto;padding:6px 8px"></div>
</header>
<main>
  <div id="banner"></div>
  <div id="app"></div>
</main>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
(function(){
'use strict';

const KEY='dhk_v1';
const TABS=[['dashboard','Dashboard'],['expenses','Daily Expenses'],['budget','Budget Planner'],['todo','To-Do'],['relax','Relax & Play'],['categories','Categories'],['reports','Reports'],['tips','Saving Tips'],['settings','Settings']];
const DEFAULT_CATS=[
 ['Grocery','🛒',false],['Food & Dining','🍽️',false],['Electricity Bill','💡',true],['Gas Bill','🔥',true],
 ['Water Bill','🚰',true],['Internet & Mobile','📱',true],['Rent','🏠',true],['Fuel','⛽',false],
 ['Transport','🚌',false],['Health & Medical','🩺',false],['Education','🎓',true],['Shopping','🛍️',false],
 ['Clothing','👕',false],['Entertainment','🎬',false],['Outings','🚗',false],['Family Activities','👨‍👩‍👧',false],
 ['Household Maintenance','🔧',false],['Subscriptions','🔁',true],['Personal Expenses','🙂',false],
 ['Loan / Debt Payments','💳',true],['Savings','🏦',false],['Miscellaneous','📦',false]
];
const METHODS=['Cash','Debit Card','Credit Card','Bank Transfer','Mobile Wallet','Other'];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rupees(v){return Math.max(0,Math.round((Number(v)||0)*100));}   // rupees -> paisa (integer, no float drift)
function fmt(p){return state.settings.currency+' '+((p||0)/100).toLocaleString('en-PK',{minimumFractionDigits:0,maximumFractionDigits:2});}
function sumArr(a){return a.reduce((x,y)=>x+y,0);}
function today(){return new Date().toLocaleDateString('en-CA',{timeZone:state.settings.timezone});}
function nowTime(){return new Date().toLocaleTimeString('en-GB',{timeZone:state.settings.timezone,hour:'2-digit',minute:'2-digit',hour12:false});}
function monthOf(d){return d.slice(0,7);}
function shiftMonth(m,delta){const [y,mo]=m.split('-').map(Number);return new Date(Date.UTC(y,mo-1+delta,1)).toISOString().slice(0,7);}
function monthLabel(m){return new Date(m+'-01T00:00:00Z').toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});}
function daysIn(m){const [y,mo]=m.split('-').map(Number);return new Date(Date.UTC(y,mo,0)).getUTCDate();}
function catOf(id){return state.categories.find(c=>c.id===id);}
function catName(id){const c=catOf(id);return c?c.icon+' '+c.name:'(deleted)';}
function expensesIn(m){return state.expenses.filter(e=>e.date.startsWith(m));}
function catTotals(m){const t={};expensesIn(m).forEach(e=>{t[e.categoryId]=(t[e.categoryId]||0)+e.amount;});return t;}
function getBudget(m){return state.budgets[m]||{income:0,savingsTarget:0,categories:{}};}
function byNewest(a,b){return b.date.localeCompare(a.date)||((b.createdAt||0)-(a.createdAt||0));}
function stat(label,value,sub){return `<div class="card stat"><div class="label">${label}</div><div class="value">${value}</div>${sub?`<div class="muted" style="font-size:13px">${sub}</div>`:''}</div>`;}
function emptyMsg(t){return `<div class="empty">${t}</div>`;}
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.display='none';},2400);}
async function download(name,data,type){
 // Standalone file (opened on a computer): normal browser download.
 if(!window.claude){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  return;
 }
 // Hosted page (claude.ai): ask the platform's downloads capability.
 let dl=null;
 try{dl=await window.claude.use('downloads');}catch(e){dl=null;}
 if(!dl) return toast('Saving files is not available on this page. Use the downloaded file version of the portal.');
 try{
  await dl.save({filename:name,data});
  toast('File saved');
 }catch(err){
  if(err&&err.code==='declined') toast('Save cancelled');
  else toast('Could not save the file. Please try again.');
 }
}

/* ---------- storage ---------- */
function defaults(){
 return{
  categories:DEFAULT_CATS.map(([name,icon,fixed])=>({id:uid(),name,icon,active:true,fixed})),
  expenses:[],
  budgets:{},
  todos:[],
  settings:{household:'Our Family',currency:'PKR',timezone:'Asia/Karachi',reminderEnabled:true,reminderTime:'20:00',dismissedDate:'',notifiedDate:'',reviewedTips:[]}
 };
}
function load(){
 let s=null;
 try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){s=null;}
 if(!s||!Array.isArray(s.categories)||!Array.isArray(s.expenses)) return defaults();
 const d=defaults();
 s.settings=Object.assign({},d.settings,s.settings||{});
 s.budgets=s.budgets||{};
 s.todos=s.todos||[];
 s.categories.forEach(c=>{if(c.fixed===undefined)c.fixed=false;if(c.active===undefined)c.active=true;});
 return s;
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}

let state=load();
let view='dashboard';
let month=monthOf(today());
let editingId=null;
let reportDate='';
let filters={q:'',cat:'',from:'',to:'',min:'',max:'',by:''};

/* ---------- filtered expenses ---------- */
function filteredExpenses(){
 const q=filters.q.trim().toLowerCase();
 const noDate=!filters.from&&!filters.to;
 return state.expenses.filter(e=>{
  if(noDate&&!e.date.startsWith(month)) return false;
  if(filters.from&&e.date<filters.from) return false;
  if(filters.to&&e.date>filters.to) return false;
  if(filters.cat&&e.categoryId!==filters.cat) return false;
  if(filters.by&&!(e.paidBy||'').toLowerCase().includes(filters.by.trim().toLowerCase())) return false;
  if(filters.min!==''&&e.amount<rupees(filters.min)) return false;
  if(filters.max!==''&&e.amount>rupees(filters.max)) return false;
  if(q&&!((e.title+' '+(e.notes||'')).toLowerCase().includes(q))) return false;
  return true;
 }).sort(byNewest);
}

/* ---------- views ---------- */
function viewDashboard(){
 const ex=expensesIn(month);
 const total=sumArr(ex.map(e=>e.amount));
 const b=getBudget(month);
 const budgetTotal=sumArr(Object.values(b.categories));
 const remaining=b.income-total;
 const util=budgetTotal?Math.round(total/budgetTotal*100):0;
 const t=today();
 const todayTotal=sumArr(state.expenses.filter(e=>e.date===t).map(e=>e.amount));
 const ct=catTotals(month);
 const top=Object.entries(ct).sort((x,y)=>y[1]-x[1]).slice(0,6);
 const topMax=Math.max(1,...top.map(x=>x[1]));
 const daily=Array(daysIn(month)).fill(0);
 ex.forEach(e=>{daily[Number(e.date.slice(8,10))-1]+=e.amount;});
 const dMax=Math.max(1,...daily);
 const warnings=state.categories
  .filter(c=>b.categories[c.id]&&(ct[c.id]||0)>=0.8*b.categories[c.id])
  .map(c=>{const p=Math.round((ct[c.id]||0)/b.categories[c.id]*100);
   return `<div class="tip" style="border-color:${p>=100?'#dc2626':'#d97706'}">${esc(c.icon+' '+c.name)}: ${p}% of budget used${p>=100?' (over budget)':''}</div>`;}).join('');
 const recent=[...state.expenses].sort(byNewest).slice(0,6);
 const saved=remaining;
 const target=b.savingsTarget||0;
 const targetSub=target?(saved>=target?'Target reached':'Still to save: '+fmt(target-saved)):'No savings target set';
 return `
 ${quoteCard()}
 <h2>Dashboard - ${monthLabel(month)}</h2>
 <div class="grid">
  ${stat('Income',fmt(b.income),b.income?'':'Set it in Budget Planner')}
  ${stat('Total expenses',fmt(total))}
  ${stat('Remaining balance',`<span class="${remaining<0?'up':''}">${fmt(remaining)}</span>`,'Savings so far')}
  ${stat('Savings target',fmt(target),targetSub)}
  ${stat('Budget used',util+'%',budgetTotal?fmt(budgetTotal)+' planned':'No budget set')}
  ${stat("Today's spending",fmt(todayTotal),t)}
 </div>
 <div class="two" style="margin-top:16px">
  <div class="card"><h3>Daily spending</h3>${total?`<div class="chart">${daily.map((v,i)=>`<div class="col" style="height:${Math.round(v/dMax*100)}%" data-tip="${i+1}: ${fmt(v)}"></div>`).join('')}</div><div class="muted" style="font-size:12px">Day 1 to ${daysIn(month)}</div>`:emptyMsg('No expenses recorded this month yet.')}</div>
  <div class="card"><h3>Top categories</h3>${top.length?top.map(([id,v])=>`<div style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><span>${esc(catName(id))}</span><span>${fmt(v)}</span></div><div class="bar"><div style="width:${Math.round(v/topMax*100)}%"></div></div></div>`).join(''):emptyMsg('No category data yet.')}</div>
 </div>
 <div class="two">
  <div class="card"><h3>Budget warnings</h3>${warnings||'<p class="muted">No category has reached 80% of its budget.</p>'}</div>
  <div class="card"><h3>Recent transactions</h3>${recent.length?recent.map(e=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--border);padding:7px 0"><div><div>${esc(e.title)}</div><div class="muted" style="font-size:12px">${e.date} &middot; ${esc((catOf(e.categoryId)||{}).name||'')}</div></div><div>${fmt(e.amount)}</div></div>`).join(''):emptyMsg('No transactions yet. Add your first expense.')}</div>
 </div>
 ${todoWidget()}`;
}

function expenseForm(ed){
 const cats=state.categories.filter(c=>c.active||(ed&&ed.categoryId===c.id));
 const v=ed||{};
 const people=[...new Set(state.expenses.map(e=>e.paidBy).filter(Boolean))];
 return `
 <form data-form="expense" class="card">
  <h2>${ed?'Edit expense':'Add expense'}</h2>
  <div class="form-grid">
   <div><label>Amount (${esc(state.settings.currency)}) *</label><input name="amount" type="number" step="0.01" min="0.01" required value="${ed?(ed.amount/100):''}" placeholder="e.g. 3500" inputmode="decimal"></div>
   <div><label>Expense title *</label><input name="title" required maxlength="120" value="${esc(v.title||'')}" placeholder="e.g. Grocery shopping"></div>
   <div><label>Category *</label><select name="categoryId" required>${cats.map(c=>`<option value="${c.id}" ${v.categoryId===c.id?'selected':''}>${esc(c.icon+' '+c.name)}</option>`).join('')}</select></div>
   <div><label>Date *</label><input name="date" type="date" required value="${v.date||today()}"></div>
   <div><label>Time (optional)</label><input name="time" type="time" value="${esc(v.time||'')}"></div>
   <div><label>Paid by</label><input name="paidBy" list="peopleList" maxlength="60" value="${esc(v.paidBy||'')}" placeholder="Family member"><datalist id="peopleList">${people.map(p=>`<option value="${esc(p)}">`).join('')}</datalist></div>
   <div><label>Payment method</label><select name="method">${METHODS.map(m=>`<option ${v.method===m?'selected':''}>${m}</option>`).join('')}</select></div>
   <div style="grid-column:1/-1"><label>Notes</label><input name="notes" maxlength="300" value="${esc(v.notes||'')}" placeholder="Optional"></div>
  </div>
  <div class="row" style="margin-top:12px">
   <button class="btn" type="submit">${ed?'Save changes':'Save expense'}</button>
   ${ed?'<button class="btn secondary" type="button" data-act="cancelEdit">Cancel</button>':''}
  </div>
 </form>`;
}

function filterBar(){
 return `
 <div class="card no-print">
  <h3>Search and filter</h3>
  <div class="form-grid">
   <div><label>Search</label><input id="fq" data-filter="q" value="${esc(filters.q)}" placeholder="Title or notes"></div>
   <div><label>Category</label><select id="fcat" data-filter="cat"><option value="">All categories</option>${state.categories.map(c=>`<option value="${c.id}" ${filters.cat===c.id?'selected':''}>${esc(c.icon+' '+c.name)}</option>`).join('')}</select></div>
   <div><label>From date</label><input id="ffrom" type="date" data-filter="from" value="${filters.from}"></div>
   <div><label>To date</label><input id="fto" type="date" data-filter="to" value="${filters.to}"></div>
   <div><label>Min amount</label><input id="fmin" type="number" data-filter="min" value="${esc(filters.min)}"></div>
   <div><label>Max amount</label><input id="fmax" type="number" data-filter="max" value="${esc(filters.max)}"></div>
   <div><label>Paid by</label><input id="fby" data-filter="by" value="${esc(filters.by)}"></div>
  </div>
  <div class="row" style="margin-top:10px"><button class="btn secondary small" data-act="clearFilters">Clear filters</button><span class="muted" style="font-size:13px">With no dates set, the list shows ${monthLabel(month)}.</span></div>
 </div>`;
}

function viewExpenses(){
 const ed=editingId?state.expenses.find(e=>e.id===editingId):null;
 const list=filteredExpenses();
 const total=sumArr(list.map(e=>e.amount));
 const todayTotal=sumArr(state.expenses.filter(e=>e.date===today()).map(e=>e.amount));
 const rows=list.map(e=>`
  <tr>
   <td style="white-space:nowrap">${e.date}${e.time?`<div class="muted" style="font-size:12px">${esc(e.time)}</div>`:''}</td>
   <td><strong>${esc(e.title)}</strong>${e.notes?`<div class="muted" style="font-size:12px">${esc(e.notes)}</div>`:''}</td>
   <td><span class="tag">${esc(catName(e.categoryId))}</span></td>
   <td class="hide-sm">${esc(e.paidBy||'-')}<div class="muted" style="font-size:12px">${esc(e.method||'')}</div></td>
   <td class="num"><strong>${fmt(e.amount)}</strong></td>
   <td class="num no-print" style="white-space:nowrap"><button class="btn small secondary" data-act="edit" data-id="${e.id}">Edit</button> <button class="btn small danger" data-act="del" data-id="${e.id}">Delete</button></td>
  </tr>`).join('');
 return `
 <div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0">Daily expenses</h2><span class="muted">Today's total: <strong>${fmt(todayTotal)}</strong></span></div>
 ${expenseForm(ed)}
 ${filterBar()}
 <div class="card">
  <div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">Transactions (${list.length})</h3><strong>Total: ${fmt(total)}</strong></div>
  ${list.length?`<div class="tbl-wrap"><table><tr><th>Date</th><th>Expense</th><th>Category</th><th class="hide-sm">Paid by</th><th class="num">Amount</th><th class="num no-print"></th></tr>${rows}</table></div>`:emptyMsg('No expenses match. Add one above or change the filters.')}
 </div>`;
}

function viewBudget(){
 const b=getBudget(month);
 const ct=catTotals(month);
 const cats=state.categories.filter(c=>c.active||b.categories[c.id]||ct[c.id]);
 const totalBud=sumArr(Object.values(b.categories));
 const totalAct=sumArr(Object.values(ct));
 const rows=cats.map(c=>{
  const bud=b.categories[c.id]||0, act=ct[c.id]||0;
  const pct=bud?Math.round(act/bud*100):null;
  const cls=pct>=100?'over':pct>=80?'warn':'';
  return `<tr>
   <td>${esc(c.icon+' '+c.name)}</td>
   <td class="num"><input name="cat_${c.id}" type="number" step="0.01" min="0" value="${bud?bud/100:''}" style="width:130px;text-align:right" placeholder="0"></td>
   <td class="num">${fmt(act)}</td>
   <td class="num">${bud?fmt(bud-act):'-'}</td>
   <td style="min-width:140px">${bud?`<div class="bar ${cls}"><div style="width:${Math.min(pct,100)}%"></div></div><span class="muted" style="font-size:12px">${pct}% used</span>`:'<span class="muted">No budget set</span>'}</td>
  </tr>`;}).join('');
 return `
 <div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0">Budget planner - ${monthLabel(month)}</h2></div>
 <div class="grid" style="margin-bottom:16px">
  ${stat('Monthly income',fmt(b.income))}
  ${stat('Planned budget',fmt(totalBud))}
  ${stat('Actual spending',fmt(totalAct))}
  ${stat('Planned savings',fmt(b.income-totalBud),'Income minus planned budget')}
  ${stat('Actual savings',fmt(b.income-totalAct),'Income minus actual spending')}
 </div>
 <form data-form="budget" class="card">
  <div class="form-grid" style="margin-bottom:12px">
   <div><label>Monthly income (${esc(state.settings.currency)})</label><input name="income" type="number" step="0.01" min="0" value="${b.income?b.income/100:''}" placeholder="e.g. 150000"></div>
   <div><label>Savings target (${esc(state.settings.currency)})</label><input name="savings" type="number" step="0.01" min="0" value="${b.savingsTarget?b.savingsTarget/100:''}" placeholder="e.g. 20000"></div>
  </div>
  <div class="row" style="margin-bottom:12px">
   <button class="btn" type="submit">Save budget</button>
   <button class="btn secondary" type="button" data-act="copyBudget">Copy from previous month</button>
  </div>
  <div class="tbl-wrap">
   ${cats.length?`<table><tr><th>Category</th><th class="num">Budget</th><th class="num">Actual</th><th class="num">Remaining</th><th>Utilisation</th></tr>${rows}</table>`:emptyMsg('Add categories first.')}
  </div>
  <p class="muted" style="font-size:13px;margin-bottom:0">Bars turn orange at 80% and red at 100% of a category budget. Changing a budget never changes your past expense records.</p>
 </form>`;
}

function viewCategories(){
 const rows=state.categories.map(c=>{
  const used=state.expenses.filter(e=>e.categoryId===c.id).length;
  return `<tr>
   <td>${esc(c.icon)}</td>
   <td>${esc(c.name)}${c.fixed?' <span class="tag">Fixed</span>':''}</td>
   <td>${c.active?'Active':'<span class="muted">Archived</span>'}</td>
   <td class="num">${used}</td>

/* ---------- rule-based saving suggestions (no AI key needed) ---------- */
function computeTips(){
 const m=month, tips=[], b=getBudget(m), ct=catTotals(m);
 if(!b.income){
  tips.push({key:'income-'+m,title:'Add your monthly income',observed:'No income is recorded for this month.',data:'Budget Planner, Monthly income field.',why:'Savings and remaining balance cannot be calculated without income.',alt:'Enter your expected income in Budget Planner.',saving:null,assumptions:'None.'});
 }
 state.categories.forEach(c=>{
  const cur=ct[c.id]||0;
  if(!cur) return;
  const prevs=[1,2,3].map(i=>catTotals(shiftMonth(m,-i))[c.id]||0).filter(x=>x>0);
  if(!prevs.length) return;
  const avg=Math.round(sumArr(prevs)/prevs.length);
  if(cur>avg*1.2&&cur-avg>=50000){
   const count=expensesIn(m).filter(e=>e.categoryId===c.id).length;
   tips.push({key:'spike-'+c.id+'-'+m,title:c.name+' is higher than usual',
    observed:`${fmt(cur)} spent this month, compared with an average of ${fmt(avg)} over the last ${prevs.length} month(s) with spending.`,
    data:`${count} transaction(s) in ${c.name} this month, plus your earlier records.`,
    why:`This is about ${Math.round((cur-avg)/avg*100)}% above your recent average.`,
    alt:'Set a weekly limit for this category and review it each weekend.',
    saving:cur-avg,
    assumptions:'Assumes spending returns to your recent average. Actual savings depend on your choices.'});
  }
 });
 state.categories.forEach(c=>{
  const bud=b.categories[c.id]||0, cur=ct[c.id]||0;
  if(bud&&cur>bud){
   tips.push({key:'over-'+c.id+'-'+m,title:c.name+' is over budget',
    observed:`${fmt(cur-bud)} over its budget of ${fmt(bud)}.`,
    data:'Budget Planner and your transactions for this month.',
    why:'Spending went past the limit you planned for this category.',
    alt:'Pause new spending in this category for the rest of the month, or move the extra amount from another planned category.',
    saving:cur-bud,
    assumptions:'Assumes spending stays within budget for the rest of the month.'});
  }
 });
 const outIds=state.categories.filter(c=>/outing|entertain|family act|dining|food/i.test(c.name)).map(c=>c.id);
 const outTotal=sumArr(outIds.map(id=>ct[id]||0));
 if(b.income&&outTotal/b.income>0.15){
  tips.push({key:'outing-'+m,title:'Outings and dining take a large share of income',
   observed:`Outing, dining and entertainment categories total ${fmt(outTotal)}, about ${Math.round(outTotal/b.income*100)}% of income.`,
   data:'Categories: Outings, Food & Dining, Entertainment, Family Activities.',
   why:'These costs add up quickly when they are not planned in advance.',
   alt:'Plan one outing budget for the month and choose the activities in advance.',
   saving:Math.round(outTotal*0.2),
   assumptions:'Example estimate: assumes a 20% reduction in these categories.'});
 }
 const counts={};
 expensesIn(m).forEach(e=>{const k=e.title.trim().toLowerCase();counts[k]=(counts[k]||0)+1;});
 const rep=Object.entries(counts).filter(([,n])=>n>=5).sort((a,c)=>c[1]-a[1])[0];
 if(rep){
  tips.push({key:'repeat-'+rep[0]+'-'+m,title:'Repeated purchase: "'+rep[0]+'"',
   observed:`A similar expense was recorded ${rep[1]} times this month.`,
   data:'Your daily expense records for this month.',
   why:'Frequent small purchases can add up over a month.',
   alt:'Check whether this can be bought in bulk or planned as one weekly purchase.',
   saving:null,
   assumptions:'Saving not calculated because the amount per purchase varies.'});
 }
 return tips.filter(t=>!state.settings.reviewedTips.includes(t.key));
}

function viewTips(){
 const tips=computeTips();
 const intro=`<div class="card"><h2>Saving suggestions - ${monthLabel(month)}</h2><p class="muted" style="margin:0">These suggestions use only the expenses you recorded. They are estimates, not guarantees. Nothing is changed automatically. You decide what to do.</p></div>`;
 if(!tips.length) return intro+`<div class="card">${emptyMsg('No suggestions right now. Keep recording your expenses and suggestions will appear here.')}</div>`;

}

/* ---------- relax & play: endless Coin Catcher ---------- */
const game={running:false,canvas:null,x:180,items:[],score:0,lives:3,over:false,last:0,spawn:0,keys:{left:false,right:false},raf:0};
function gameHtml(){
 return `<div class="card"><h2>Coin Catcher (endless)</h2>
  <p class="muted" style="margin-top:0">Catch the coins 🪙 with your basket. Avoid the 💸 spending traps. You have 3 lives. The game never ends and gets faster as your score grows.</p>
  <div class="row" style="justify-content:space-between;margin-bottom:8px"><span>Score: <strong id="gScore">${game.score}</strong></span><span>Lives: <strong id="gLives">${game.lives}</strong></span><span>Best: <strong id="gBest">${state.settings.highScore||0}</strong></span></div>
  <canvas id="gc" width="360" height="480" style="width:100%;max-width:360px;display:block;margin:0 auto;background:#ecfeff;border-radius:12px;touch-action:none"></canvas>
  <div class="row" style="justify-content:center;margin-top:12px"><button class="btn secondary" data-act="gLeft">&#9664; Left</button><button class="btn" id="gPlayBtn" data-act="gPlay">${game.running?'Pause':'Start'}</button><button class="btn secondary" data-act="gRight">Right &#9654;</button></div>
  <p class="muted" style="text-align:center;font-size:13px">Keyboard: arrow keys. Phone or touch: drag on the game box.</p></div>`;
}
function viewRelax(){return quoteCard()+gameHtml();}
function gameReset(){game.items=[];game.score=0;game.lives=3;game.over=false;game.x=180;game.spawn=0;game.last=0;}
function updatePlayBtn(){const b=document.getElementById('gPlayBtn');if(b)b.textContent=game.running?'Pause':'Start';}
function drawGame(){
 const c=game.canvas||document.getElementById('gc'); if(!c) return;
 const ctx=c.getContext('2d');
 ctx.fillStyle='#ecfeff';ctx.fillRect(0,0,360,480);
 ctx.font='26px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
 game.items.forEach(it=>ctx.fillText(it.bad?'💸':'🪙',it.x,it.y));
 ctx.fillStyle='#0f766e';ctx.beginPath();
 if(ctx.roundRect) ctx.roundRect(game.x-30,448,60,16,8); else ctx.rect(game.x-30,448,60,16);
 ctx.fill();
 if(!game.running){
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,360,480);
  ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';
  ctx.fillText(game.over?'Game over! Score: '+game.score:(game.score?'Paused':'Press Start to play'),180,220);
  ctx.font='15px sans-serif';ctx.fillText(game.over?'Press Start to play again':'',180,252);
 }
 const s=document.getElementById('gScore');if(s)s.textContent=game.score;
 const l=document.getElementById('gLives');if(l)l.textContent=game.lives;
 const bst=document.getElementById('gBest');if(bst)bst.textContent=state.settings.highScore||0;
}
function gameLoop(ts){
 if(!game.running) return;
 if(!document.getElementById('gc')){game.running=false;return;}
 if(!game.last) game.last=ts;
 const dt=Math.min(3,(ts-game.last)/16.7); game.last=ts;
 if(game.keys.left) game.x-=6*dt;
 if(game.keys.right) game.x+=6*dt;
 game.x=Math.max(34,Math.min(326,game.x));
 const speed=1.5+game.score/150;
 game.spawn-=dt;
 if(game.spawn<=0){
  game.items.push({x:20+Math.random()*320,y:-16,bad:Math.random()<0.22,v:speed*(0.8+Math.random()*0.5)});
  game.spawn=Math.max(22,55-game.score/12)*(0.6+Math.random()*0.6);
 }
 game.items.forEach(it=>{it.y+=it.v*dt;});
 game.items=game.items.filter(it=>{
  if(it.y>=430&&it.y<=470&&Math.abs(it.x-game.x)<30){
   if(it.bad) game.lives--; else game.score+=10;
   return false;
  }
  return it.y<500;
 });
 if(game.lives<=0){
  game.running=false;game.over=true;
  if(game.score>(state.settings.highScore||0)){state.settings.highScore=game.score;save();}
 }
 drawGame();
 if(game.running) game.raf=requestAnimationFrame(gameLoop);
 else updatePlayBtn();
}
function gameAttach(){
 const c=document.getElementById('gc'); if(!c) return;
 game.canvas=c;
 const move=e=>{const r=c.getBoundingClientRect();game.x=(e.clientX-r.left)/r.width*360;};
 c.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||e.buttons) move(e);});
 c.addEventListener('pointerdown',move);
 drawGame();
}
window.addEventListener('keydown',e=>{if(!document.getElementById('gc'))return;if(e.key==='ArrowLeft'){game.keys.left=true;e.preventDefault();}if(e.key==='ArrowRight'){game.keys.right=true;e.preventDefault();}});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')game.keys.left=false;if(e.key==='ArrowRight')game.keys.right=false;});

 $('#householdName').textContent=state.settings.household||'Family Budget Planner';
}
function render(){
 renderNav();
 $('#monthPick').value=month;
 renderBanner();
 const active=document.activeElement;
 const focusId=active&&active.id&&$('#app').contains(active)?active.id:null;
 if(view!=='relax'&&game.running){game.running=false;cancelAnimationFrame(game.raf);}
 $('#app').innerHTML=views[view]();
 if(view==='relax') gameAttach();
 if(focusId){
  const el=document.getElementById(focusId);
  if(el){el.focus();try{const n=el.value.length;el.setSelectionRange(n,n);}catch(_){}}
 }
}

/* ---------- actions ---------- */
const actions={
 edit(el){editingId=el.dataset.id;view='expenses';render();window.scrollTo(0,0);},
 del(el){
  if(!confirm('Delete this expense? This cannot be undone.')) return;
  state.expenses=state.expenses.filter(e=>e.id!==el.dataset.id);
  save();toast('Expense deleted');render();
 },
 cancelEdit(){editingId=null;render();},
 clearFilters(){filters={q:'',cat:'',from:'',to:'',min:'',max:'',by:''};render();},
 gotoToday(){view='expenses';editingId=null;render();},
 dismiss(){state.settings.dismissedDate=today();save();render();},
 copyBudget(){
  const prev=shiftMonth(month,-1);
  if(!state.budgets[prev]) return toast('No budget found for '+monthLabel(prev));
  if(!confirm(`Copy the budget from ${monthLabel(prev)} into ${monthLabel(month)}? This replaces the current budget for ${monthLabel(month)}. Past expense records will not change.`)) return;
  state.budgets[month]=JSON.parse(JSON.stringify(state.budgets[prev]));
  save();toast('Budget copied');render();
 },
 catRename(el){
  const c=catOf(el.dataset.id); if(!c) return;
  const name=(prompt('New name for this category:',c.name)||'').trim();
  if(!name) return;
  if(state.categories.some(x=>x.id!==c.id&&x.name.toLowerCase()===name.toLowerCase())) return toast('That name is already used.');
  c.name=name;save();toast('Category renamed');render();
 },
 catToggle(el){
  const c=catOf(el.dataset.id); if(!c) return;
  c.active=!c.active;save();toast(c.active?'Category restored':'Category archived');render();
 },
 catDelete(el){
  const c=catOf(el.dataset.id); if(!c) return;
  if(state.expenses.some(e=>e.categoryId===c.id)) return toast('This category has transactions. Archive it instead.');
  if(!confirm(`Delete category "${c.name}"?`)) return;
  state.categories=state.categories.filter(x=>x.id!==c.id);
  Object.values(state.budgets).forEach(b=>{delete b.categories[c.id];});
  save();toast('Category deleted');render();
 },
 reviewTip(el){
  state.settings.reviewedTips.push(el.dataset.id);save();toast('Marked as reviewed');render();
 },
 exportCsv(el){
  const all=el.dataset.scope==='all';
  const list=(all?[...state.expenses]:expensesIn(month)).sort(byNewest);
  const head=['Date','Time','Title','Category','Amount','Paid by','Method','Notes'];
  const rows=list.map(e=>[e.date,e.time||'',e.title,(catOf(e.categoryId)||{}).name||'',(e.amount/100).toFixed(2),e.paidBy||'',e.method||'',e.notes||'']);
  const csv='\uFEFF'+[head,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  download(`expenses-${all?'all':month}.csv`,csv,'text/csv;charset=utf-8');
 },
 exportJson(){download(`daily-hisab-kitab-backup-${today()}.json`,JSON.stringify(state,null,2),'application/json');},
 importJson(){$('#importFile').click();},
 resetAll(){
  if(!confirm('Erase ALL data stored in this browser? Download a backup first.')) return;
  if(!confirm('Are you absolutely sure? This cannot be undone.')) return;
  localStorage.removeItem(KEY);state=defaults();editingId=null;render();toast('All data erased');
 },
 async enableNotif(){
  if(!('Notification' in window)) return toast('Browser notifications are not supported here.');
  const p=await Notification.requestPermission();
  toast(p==='granted'?'Notifications enabled':'Notifications not enabled');
 },
 printReport(){
  if(window.claude) return toast('Printing is not available on this hosted page. Use the downloaded file version to print.');
  window.print();
 },
 goTodo(){view='todo';render();},
 todoToggle(el){const t=state.todos.find(x=>x.id===el.dataset.id);if(t){t.done=!t.done;save();}render();},
 todoDel(el){if(!confirm('Delete this task?'))return;state.todos=state.todos.filter(x=>x.id!==el.dataset.id);save();toast('Task deleted');render();},
 todoClear(){const n=state.todos.filter(x=>x.done).length;if(!n)return;if(!confirm('Remove '+n+' completed task(s)?'))return;state.todos=state.todos.filter(x=>!x.done);save();toast('Completed tasks removed');render();},
 gPlay(){
  const c=document.getElementById('gc'); if(!c) return;
  if(game.running){game.running=false;cancelAnimationFrame(game.raf);drawGame();updatePlayBtn();return;}
  if(game.over||game.lives<=0) gameReset();
  game.canvas=c;game.running=true;game.last=0;updatePlayBtn();
  game.raf=requestAnimationFrame(gameLoop);
 },
 gLeft(){game.x=Math.max(34,game.x-20);drawGame();},
 gRight(){game.x=Math.min(326,game.x+20);drawGame();}
};

/* ---------- form submissions ---------- */
const forms={
 todo(f){
  const fd=new FormData(f);
  const text=String(fd.get('text')||'').trim();
  const due=String(fd.get('due')||'');
  if(!text) return toast('Please write the task.');
  if(due&&!/^\d{4}-\d{2}-\d{2}$/.test(due)) return toast('Please choose a valid due date.');
  state.todos.push({id:uid(),text,due,done:false,createdAt:Date.now()});
  save();toast('Task added');render();
 },
 expense(f){
  const fd=new FormData(f);
  const amount=rupees(fd.get('amount'));
  const title=String(fd.get('title')||'').trim();
  const date=String(fd.get('date')||'');
  const categoryId=String(fd.get('categoryId')||'');
  if(!title) return toast('Please enter a title.');
  if(!(amount>0)||amount>1e12) return toast('Please enter a valid amount greater than zero.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return toast('Please choose a valid date.');
  if(!catOf(categoryId)) return toast('Please choose a category.');
  const rec={title,amount,categoryId,date,time:String(fd.get('time')||''),paidBy:String(fd.get('paidBy')||'').trim(),method:String(fd.get('method')||'Cash'),notes:String(fd.get('notes')||'').trim(),updatedAt:Date.now()};
  if(editingId){
   const x=state.expenses.find(e=>e.id===editingId);
   if(x) Object.assign(x,rec);
   editingId=null;toast('Expense updated');
  }else{
   state.expenses.push(Object.assign({id:uid(),createdAt:Date.now()},rec));
   toast('Expense saved');
  }
  month=date.slice(0,7);
  save();view='expenses';render();
 },
 budget(f){
  const fd=new FormData(f);
  const b={income:rupees(fd.get('income')),savingsTarget:rupees(fd.get('savings')),categories:{}};
  state.categories.forEach(c=>{const v=rupees(fd.get('cat_'+c.id));if(v>0)b.categories[c.id]=v;});
  state.budgets[month]=b;
  save();toast('Budget saved');render();
 },
 category(f){
  const fd=new FormData(f);
  const name=String(fd.get('name')||'').trim();
  const icon=String(fd.get('icon')||'').trim()||'📌';
  if(!name) return;
  if(state.categories.some(c=>c.name.toLowerCase()===name.toLowerCase())) return toast('That category already exists.');
  state.categories.push({id:uid(),name,icon,active:true,fixed:false});
  save();toast('Category added');render();
 },
 settings(f){
  const fd=new FormData(f);
  const tz=String(fd.get('timezone')||'').trim()||'Asia/Karachi';
  try{new Date().toLocaleString('en',{timeZone:tz});}catch(err){return toast('Timezone not recognised. Example: Asia/Karachi');}
  Object.assign(state.settings,{
   household:String(fd.get('household')||'').trim()||'Our Family',
   currency:String(fd.get('currency')||'').trim().slice(0,5)||'PKR',
   timezone:tz,
   reminderEnabled:fd.get('reminderEnabled')==='on',
   reminderTime:String(fd.get('reminderTime')||'20:00')
  });
  save();toast('Settings saved');render();
 }
};

/* ---------- event wiring ---------- */
document.addEventListener('click',e=>{
 const n=e.target.closest('[data-nav]');
 if(n){view=n.dataset.nav;editingId=null;render();window.scrollTo(0,0);return;}
 const a=e.target.closest('[data-act]');
 if(a&&actions[a.dataset.act]) actions[a.dataset.act](a);
});
document.addEventListener('submit',e=>{
 e.preventDefault();
 const h=forms[e.target.dataset.form];
 if(h) h(e.target);
});
['input','change'].forEach(evt=>{
 document.getElementById('app').addEventListener(evt,e=>{
  const k=e.target.dataset.filter;
  if(!k) return;
  if(k==='rdate') reportDate=e.target.value||today();
  else filters[k]=e.target.value;
  render();
 });
});
$('#monthPick').addEventListener('change',e=>{if(e.target.value){month=e.target.value;editingId=null;render();}});
$('#importFile').addEventListener('change',async e=>{
 const file=e.target.files[0];
 if(!file) return;
 try{
  const data=JSON.parse(await file.text());
  if(!Array.isArray(data.categories)||!Array.isArray(data.expenses)) throw new Error('invalid');
  if(!confirm('Restore this backup? It will replace the data currently stored in this browser.')) return;
  state=data;
  state.settings=Object.assign(defaults().settings,state.settings||{});
  state.budgets=state.budgets||{};
  state.todos=state.todos||[];
  save();toast('Backup restored');render();
 }catch(err){
  toast('This file is not a valid Daily Hisab Kitab backup.');
 }finally{
  e.target.value='';
 }
});

/* ---------- reminders ---------- */
function reminderTick(){
 renderBanner();
 const s=state.settings, t=today();
 const due=s.reminderEnabled&&nowTime()>=s.reminderTime&&!state.expenses.some(e=>e.date===t);
 if(due&&'Notification' in window&&Notification.permission==='granted'&&s.notifiedDate!==t){
  new Notification('Daily Hisab Kitab',{body:"Have you added today's expenses?"});
  s.notifiedDate=t;save();
 }
}

render();
setInterval(reminderTick,60000);
})();
</script>
</body>
</html>
